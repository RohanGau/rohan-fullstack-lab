name: Web CI & Deploy (Cloudflare Pages)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/web-cloudflare.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/web-cloudflare.yml'
  workflow_dispatch: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Headers, Lint, Typecheck, Unit Tests, E2E & Lighthouse
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_PUBLIC_SITE_URL: https://rohangautam.dev
      NEXT_PUBLIC_CDN_URL: https://assets.rohangautam.dev
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:packages

      - name: Check security headers sync
        run: pnpm --filter web check:headers

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Unit & component tests
        run: pnpm --filter web test

      - name: Build Next.js app
        run: pnpm --filter web build

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run Playwright E2E & Axe accessibility checks
        run: pnpm --filter web test:e2e

      - name: Run Lighthouse CI quality & CWV budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: apps/web/lighthouserc.json
          temporaryPublicStorage: true

  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      PAGES_PROJECT: rohan-fullstack-lab

    steps:
      # ─────────────────────────────────────────────────────────────
      # SETUP
      # ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENV_FILE=.env.production" >> $GITHUB_OUTPUT
            echo "DEPLOY_ENV=production" >> $GITHUB_OUTPUT
            echo "BRANCH=" >> $GITHUB_OUTPUT
          else
            echo "ENV_FILE=.env.stage" >> $GITHUB_OUTPUT
            echo "DEPLOY_ENV=preview" >> $GITHUB_OUTPUT
            echo "BRANCH=develop" >> $GITHUB_OUTPUT
          fi

      - name: Show deployment info
        run: |
          echo "🎯 Environment: ${{ steps.env.outputs.DEPLOY_ENV }}"
          echo "📁 Using: apps/web/${{ steps.env.outputs.ENV_FILE }}"
          echo "🌿 Branch: ${{ steps.env.outputs.BRANCH || 'production' }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ─────────────────────────────────────────────────────────────
      # SECURITY
      # ─────────────────────────────────────────────────────────────
      - name: Security audit
        run: pnpm audit --audit-level high
        continue-on-error: true # Don't fail deployment on audit warnings

      # ─────────────────────────────────────────────────────────────
      # BUILD
      # ─────────────────────────────────────────────────────────────
      - name: Build shared packages
        run: pnpm build:packages

      - name: Clean previous build
        run: rm -rf apps/web/.vercel apps/web/.next apps/web/.wrangler

      - name: Build for Cloudflare
        run: |
          if [ "${{ steps.env.outputs.DEPLOY_ENV }}" = "production" ]; then
            pnpm web:build:prod
          else
            pnpm web:build:stage
          fi

      - name: Verify build output
        run: |
          ROOT="apps/web/.vercel/output"
          if [ -d "$ROOT/static" ]; then
            echo "✅ Build successful"
            ls -la "$ROOT/static" | head -20
          else
            echo "❌ Build failed - no output found"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────
      # DEPLOY
      # ─────────────────────────────────────────────────────────────
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd apps/web

          if [ "${{ steps.env.outputs.DEPLOY_ENV }}" = "production" ]; then
            echo "🚀 Deploying to PRODUCTION"
            npx wrangler pages deploy .vercel/output/static \
              --project-name=${{ env.PAGES_PROJECT }} \
              --commit-dirty=true
          else
            echo "🔧 Deploying to PREVIEW"
            npx wrangler pages deploy .vercel/output/static \
              --project-name=${{ env.PAGES_PROJECT }} \
              --branch=${{ steps.env.outputs.BRANCH }} \
              --commit-dirty=true
          fi
